<div class="complex-modal">
    <div class="modal-wrapper">
      <div class="close-modal-icon" (click)="closeModal()"></div>
      <div class="modal-content" #modalContent>
        <div class="modal-header border-bottom">
          <h3 class="steel weight-medium size-default m-0">{{'tr_new_branch' | translate}}</h3>
        </div>
        <div class="modal-body weight-medium steel">
          <div class="add-student-modal-container">
            <div>
              <div class="content-container plr-4 ptb-3">
                <div
                  class="alert alert-error mb-3"
                  *ngIf="branchForm.invalid && branchForm.submitted"
                >
                {{'tr_tr_fill_required_fields' | translate}}
                </div>
  
                <form #branchForm="ngForm">
                  <nav
                    class="branch-modal-tabs"
                    role="tablist"
                    [attr.aria-label]="'tr_new_branch' | translate"
                  >
                    <button
                      type="button"
                      class="branch-modal-tabs__btn"
                      role="tab"
                      [class.is-active]="activeTab === generalTab.id"
                      [attr.aria-selected]="activeTab === generalTab.id"
                      (click)="activeTab = generalTab.id"
                    >
                      <i class="fa" [ngClass]="generalTab.icon" aria-hidden="true"></i>
                      <span>{{ generalTab.labelKey | translate }}</span>
                    </button>
                    <button
                      type="button"
                      class="branch-modal-tabs__btn"
                      role="tab"
                      [class.is-active]="activeTab === salespeopleTab.id"
                      [attr.aria-selected]="activeTab === salespeopleTab.id"
                      (click)="activeTab = salespeopleTab.id"
                    >
                      <i class="fa" [ngClass]="salespeopleTab.icon" aria-hidden="true"></i>
                      <span>{{ salespeopleTab.labelKey | translate }}</span>
                    </button>
                    <button
                      *ngIf="deliveryOrdersEnabled"
                      type="button"
                      class="branch-modal-tabs__btn"
                      role="tab"
                      [class.is-active]="activeTab === deliveryTab.id"
                      [attr.aria-selected]="activeTab === deliveryTab.id"
                      (click)="activeTab = deliveryTab.id"
                    >
                      <i class="fa" [ngClass]="deliveryTab.icon" aria-hidden="true"></i>
                      <span>{{ deliveryTab.labelKey | translate }}</span>
                    </button>
                  </nav>

                  <div *ngIf="activeTab === 'general'" role="tabpanel" class="branch-modal-panel">
                  <div class="row">
                    <!-- Branch Name -->
                    <div class="col-md-4">
                      <div
                        class="form-group"
                        [class.has-error]="branchName.invalid && branchForm.submitted"
                      >
                        <label for="">{{ 'tr_branch_name' | translate }}</label>
                        <input
                          #branchName="ngModel"
                          type="text"
                          class="s-control"
                          name="name"
                          ngModel
                          required
                        />
                        <span
                          class="text-error size-small validator"
                          *ngIf="branchName.invalid && branchForm.submitted"
                        >
                          Branch name is required.
                        </span>
                      </div>
                    </div>
                
                    <!-- Store Address -->
                    <div class="col-md-4">
                      <div
                        class="form-group"
                        [class.has-error]="storeAddress.invalid && branchForm.submitted"
                      >
                        <label for="">{{ 'tr_branch_address' | translate }}</label>
                        <input
                          #storeAddress="ngModel"
                          type="text"
                          class="s-control"
                          name="storeAddress"
                          ngModel
                          required
                        />
                        <span
                          class="text-error size-small validator"
                          *ngIf="storeAddress.invalid && branchForm.submitted"
                        >
                          Store address is required.
                        </span>
                      </div>
                    </div>
                
                    <!-- Rent -->
                    <div class="col-md-4">
                      <div class="form-group">
                        <label for="">{{ 'tr_rent' | translate }}</label>
                        <input
                          type="number"
                          class="s-control"
                          name="rent"
                          ngModel
                          min="0"
                        />
                      </div>
                    </div>
                
                    <!-- Employees Salary -->
                    <div class="col-md-4 mt-3">
                      <div class="form-group">
                        <label for="">{{ 'tr_employees_salary' | translate }}</label>
                        <input
                          type="number"
                          class="s-control"
                          name="employeesSalary"
                          ngModel
                          min="0"
                        />
                      </div>
                    </div>
                
                    <!-- Branch Invoices -->
                    <div class="col-md-4 mt-3">
                      <div class="form-group">
                        <label for="">{{ 'tr_branch_invoices' | translate }}</label>
                        <input
                          type="text"
                          class="s-control"
                          name="branchInvoices"
                          ngModel
                          
                        />
                      </div>
                    </div>
                
                    <!-- Expenses -->
                    <div class="col-md-4 mt-3">
                      <div class="form-group">
                        <label for="">{{ 'tr_expenses' | translate }}</label>
                        <input
                          type="text"
                          class="s-control"
                          name="expenses"
                          ngModel
             
                        />
                      </div>
                    </div>

                    <!-- Opening date (optional celebration window) -->
                    <div class="col-md-4 mt-3">
                      <div class="form-group">
                        <label>{{ 'tr_opening_date' | translate }}</label>
                        <div class="input-with-icon opening-date-field">
                          <input
                            name="openingDate"
                            [(ngModel)]="openingDate"
                            placeholder="{{ 'tr_pick_date' | translate }}"
                            [matDatepicker]="openingPick"
                            class="s-control"
                          />
                          <mat-datepicker #openingPick></mat-datepicker>
                          <button
                            type="button"
                            class="opening-date-field__clear"
                            *ngIf="openingDate"
                            (mousedown)="$event.preventDefault(); $event.stopPropagation()"
                            (click)="clearOpeningDate($event)"
                            [attr.aria-label]="'tr_clear_opening_date' | translate"
                            [attr.title]="'tr_clear_opening_date' | translate"
                          >
                            <i class="fa fa-times" aria-hidden="true"></i>
                          </button>
                          <mat-datepicker-toggle class="input-icon date-picker" [for]="openingPick"></mat-datepicker-toggle>
                        </div>
                        <span class="size-small text-muted d-block mt-1">{{ 'tr_opening_date_hint' | translate }}</span>
                      </div>
                    </div>
                  </div>
                  </div>

                  <div *ngIf="activeTab === 'salespeople'" role="tabpanel" class="branch-modal-panel">
                  <div class="row">
                    <div class="col-12">
                      <label class="weight-medium">{{ 'tr_branch_salespeople' | translate }}</label>
                      <p class="size-small text-muted mb-2">{{ 'tr_branch_salespeople_hint' | translate }}</p>
                    </div>
                    <div class="col-12" *ngFor="let sp of salespeople; let i = index">
                      <div class="row align-items-end mb-2">
                        <div class="col-md-8">
                          <div class="form-group mb-0">
                            <label *ngIf="i === 0">{{ 'tr_seller_name' | translate }}</label>
                            <input
                              type="text"
                              class="s-control"
                              [(ngModel)]="sp.name"
                              [name]="'salesperson_' + i"
                              [placeholder]="'tr_seller_name' | translate"
                            />
                          </div>
                        </div>
                        <div class="col-md-4">
                          <button
                            type="button"
                            class="s-btn btn-danger btn-sm"
                            (click)="removeSalesperson(i)"
                            [attr.title]="'tr_delete' | translate"
                          >
                            <i class="fa fa-trash"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                    <div class="col-12 mt-2">
                      <button type="button" class="s-btn btn-secondary btn-sm" (click)="addSalesperson()">
                        <i class="fa fa-plus mr-1"></i> {{ 'tr_add_salesperson' | translate }}
                      </button>
                    </div>
                  </div>
                  </div>

                  <div
                    *ngIf="activeTab === 'delivery' && deliveryOrdersEnabled"
                    role="tabpanel"
                    class="branch-modal-panel"
                  >
                  <div class="row">
                    <div class="col-12">
                      <label class="weight-medium">{{ 'tr_branch_delivery_staff' | translate }}</label>
                      <p class="size-small text-muted mb-2">{{ 'tr_branch_delivery_staff_hint' | translate }}</p>
                    </div>
                    <div class="col-12" *ngFor="let ds of deliveryStaff; let i = index">
                      <div class="row align-items-end mb-2">
                        <div class="col-md-8">
                          <div class="form-group mb-0">
                            <label *ngIf="i === 0">{{ 'tr_delivery_person_name' | translate }}</label>
                            <input
                              type="text"
                              class="s-control"
                              [(ngModel)]="ds.name"
                              [name]="'deliveryStaff_' + i"
                              [placeholder]="'tr_delivery_person_name' | translate"
                            />
                          </div>
                        </div>
                        <div class="col-md-4">
                          <button
                            type="button"
                            class="s-btn btn-danger btn-sm"
                            (click)="removeDeliveryStaff(i)"
                            [attr.title]="'tr_delete' | translate"
                          >
                            <i class="fa fa-trash"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                    <div class="col-12 mt-2">
                      <button type="button" class="s-btn btn-secondary btn-sm" (click)="addDeliveryStaff()">
                        <i class="fa fa-plus mr-1"></i> {{ 'tr_add_delivery_staff' | translate }}
                      </button>
                    </div>
                  </div>
                  </div>
                </form>
                
  
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer mt-3 text-right">
          <button class="s-btn btn-secondary mr-3" (click)="closeModal()">Cancel</button>
          <button
            (click)="submitForm()"
            class="s-btn btn-primary"
            type="submit"
          >
            Save
          </button>
        </div>
      </div>
    </div>
  </div>
