<div class="daily-expense-dialog">
  <h2 mat-dialog-title class="daily-expense-dialog__title">{{ 'tr_daily_expense_title' | translate }}</h2>

  <div mat-dialog-content class="daily-expense-dialog__body">
    <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group" *ngIf="showBranchPicker">
      <label>{{ 'tr_branches' | translate }}</label>
      <div class="input-with-icon">
        <ng-select
          class="s-control s-select"
          formControlName="branchId"
          [items]="branches"
          bindLabel="name"
          bindValue="_id"
          [clearable]="false"
          placeholder="{{ 'tr_branches' | translate }}"
        >
        </ng-select>
        <i class="fa fa-caret-down input-icon"></i>
      </div>
    </div>

    <div class="form-group">
      <label>{{ 'tr_daily_expense_amount' | translate }}</label>
      <input class="s-control width-100" type="number" step="0.01" min="0.01" formControlName="amount" />
    </div>

    <div class="form-group">
      <label>{{ 'tr_daily_expense_type' | translate }}</label>
      <input class="s-control width-100" type="text" formControlName="expenseType" maxlength="200" />
    </div>

    <div class="form-group mb-0">
      <label>{{ 'tr_daily_expense_notes' | translate }}</label>
      <textarea class="s-control width-100" rows="3" formControlName="notes" maxlength="2000"></textarea>
    </div>
    </form>
  </div>

  <div mat-dialog-actions align="end" class="daily-expense-dialog__actions">
    <button type="button" class="s-btn btn-secondary" (click)="cancel()" [disabled]="saving">
      {{ 'tr_action.cancel' | translate }}
    </button>
    <button type="button" class="s-btn btn-primary" (click)="submit()" [disabled]="saving">
      {{ 'tr_daily_expense_submit' | translate }}
    </button>
  </div>
</div>
