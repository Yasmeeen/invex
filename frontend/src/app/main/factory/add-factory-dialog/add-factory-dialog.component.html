<div class="complex-modal">
  <div class="modal-wrapper">
    <div class="close-modal-icon" (click)="close()"></div>
    <div class="modal-content">
      <div class="modal-header border-bottom">
        <h3 class="steel weight-medium size-default m-0">
          {{ 'tr_factory_add' | translate }}
        </h3>
      </div>

      <div class="modal-body weight-medium steel plr-4 ptb-3">
        <div class="form-group">
          <label>{{ 'tr_name' | translate }} *</label>
          <input class="s-control" type="text" [(ngModel)]="name" />
        </div>
        <div class="form-group">
          <label>{{ 'tr_address' | translate }}</label>
          <input class="s-control" type="text" [(ngModel)]="address" />
        </div>
        <div class="form-group mb-0">
          <label>{{ 'tr_notes' | translate }}</label>
          <input class="s-control" type="text" [(ngModel)]="notes" />
        </div>
      </div>

      <div class="modal-footer border-top plr-4 ptb-3 d-flex justify-content-end gap-2">
        <button type="button" class="s-btn btn-secondary" (click)="close()" [disabled]="saving">
          {{ 'tr_cancel' | translate }}
        </button>
        <button
          type="button"
          class="s-btn btn-primary"
          (click)="submit()"
          [disabled]="saving || !name.trim()"
        >
          {{ 'tr_save' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
