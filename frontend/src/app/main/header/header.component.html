<header class="app-topbar" role="banner">
  <div class="app-topbar__left">
    <button
      type="button"
      class="app-topbar__icon-btn app-topbar__menu-btn"
      (click)="onMenuClick()"
      [attr.aria-label]="'tr_menu' | translate"
    >
      <i class="fa fa-bars" aria-hidden="true"></i>
    </button>

    <a routerLink="/home" class="app-topbar__brand app-topbar__brand--inline hidden-mobile">
      <span class="app-topbar__brand-name">INVEX</span>
      <ng-container *ngIf="storeSettings.settings$ | async as store">
        <span class="app-topbar__brand-sub" *ngIf="store?.storeName">{{ store.storeName }}</span>
      </ng-container>
    </a>
  </div>

  <div class="app-topbar__right">
    <button
      type="button"
      class="app-topbar__icon-btn app-topbar__icon-btn--ghost hidden-mobile"
      [attr.aria-label]="'tr_notifications' | translate"
    >
      <span class="app-topbar__notify-dot app-topbar__notify-dot--warn" aria-hidden="true"></span>
      <i class="fa fa-bell-o" aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="app-topbar__icon-btn hidden-mobile"
      (click)="openChangeLanguageDailog()"
      [attr.aria-label]="('tr_language' | translate)"
    >
      <i class="fa fa-language" aria-hidden="true"></i>
    </button>

    <a routerLink="/cashier" class="s-btn btn-primary btn-sm app-topbar__cta hidden-mobile">
      {{ 'tr_open_cashier' | translate }}
    </a>

    <a
      href="http://www.innovation-tec.com"
      target="_blank"
      rel="noopener noreferrer"
      class="s-btn btn-secondary btn-sm app-topbar__cta-secondary hidden-mobile"
    >
      {{ 'tr_contact_us' | translate }}
    </a>

    <button
      type="button"
      class="app-topbar__icon-btn hidden-mobile"
      (click)="logout()"
      [attr.aria-label]="('tr_signin.logout' | translate)"
    >
      <i class="fa fa-power-off" aria-hidden="true"></i>
    </button>

    <div class="app-topbar__user" [class.app-topbar__user--open]="userMenuOpen">
      <button
        type="button"
        class="app-topbar__user-trigger"
        (click)="toggleUserMenu($event)"
        [attr.aria-expanded]="userMenuOpen"
        [attr.aria-haspopup]="true"
      >
        <span class="app-topbar__avatar" aria-hidden="true">{{ userInitials }}</span>
        <span class="app-topbar__user-name hidden-mobile">{{ userDisplayName }}</span>
        <i class="fa fa-caret-down app-topbar__caret" aria-hidden="true"></i>
      </button>

      <div class="app-topbar__dropdown" *ngIf="userMenuOpen">
        <button type="button" class="app-topbar__dropdown-item hidden-desktop" (click)="closeUserMenu(); openChangeLanguageDailog()">
          <i class="fa fa-language steel" aria-hidden="true"></i>
          {{ 'tr_language' | translate }}
        </button>
        <button type="button" class="app-topbar__dropdown-item app-topbar__dropdown-item--danger" (click)="logout(); closeUserMenu()">
          <i class="fa fa-sign-out" aria-hidden="true"></i>
          {{ 'tr_signin.logout' | translate }}
        </button>
      </div>
    </div>
  </div>
</header>
