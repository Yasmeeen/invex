<system-alerts></system-alerts>
<div class="main-container" [class.main-container--sidebar-collapsed]="sidebarCollapsed">
  <app-sidebar #appSidebar (collapsedChange)="onSidebarCollapsed($event)"></app-sidebar>
  <div class="main-column">
    <div class="main-header">
      <app-header (toggleDesktopSidebar)="appSidebar.toggleCollapse()"></app-header>
    </div>
    <div class="main-content plr-7 ptb-4 plr-3-mob">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Global assistant (appears on all pages) -->
<app-vixa-chat *ngIf="showFloatingVixa"></app-vixa-chat>
