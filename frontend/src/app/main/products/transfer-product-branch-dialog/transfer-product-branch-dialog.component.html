<div class="complex-modal">
  <div class="modal-wrapper">
    <div class="close-modal-icon" (click)="close()"></div>
    <div class="modal-content">
      <div class="modal-header border-bottom">
        <h3 class="steel weight-medium size-default m-0">{{ 'tr_product_transfer_branch' | translate }}</h3>
        <p class="size-small text-muted m-0 mt-1">{{ product.name }} — {{ product.code }}</p>
      </div>
      <div class="modal-body weight-medium steel plr-4 ptb-3" [formGroup]="form">
        <p class="size-small text-muted m-0 mb-3">
          {{ 'tr_branch_transfer_dialog_hint' | translate }}
        </p>
        <p class="size-small m-0 mb-3">
          {{
            'tr_branch_transfer_max_hint'
              | translate : { max: maxQuantity }
          }}
        </p>
        <div class="form-group">
          <label>{{ 'tr_branch_transfer_to_branch' | translate }}</label>
          <ng-select
            class="s-control s-select width-100"
            formControlName="toBranchId"
            [items]="branches"
            bindLabel="name"
            bindValue="_id"
            [clearable]="false"
            appendTo="body"
            placeholder="{{ 'tr_select' | translate }}"
          >
          </ng-select>
        </div>
        <div class="form-group mb-0">
          <label>{{ 'tr_branch_transfer_quantity' | translate }}</label>
          <input
            class="s-control width-100"
            type="number"
            min="1"
            [max]="maxQuantity"
            formControlName="quantity"
          />
        </div>
      </div>
      <div class="modal-footer border-top plr-4 ptb-3">
        <button type="button" class="s-btn btn-secondary" (click)="close()" [disabled]="saving">
          {{ 'tr_action.cancel' | translate }}
        </button>
        <button type="button" class="s-btn btn-primary" (click)="submit()" [disabled]="saving">
          {{ 'tr_branch_transfer_submit' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
