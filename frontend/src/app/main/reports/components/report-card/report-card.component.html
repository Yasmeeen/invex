<article class="report-card">
  <header class="report-card__head">
    <div class="report-card__head-main">
      <span class="report-card__icon-box" aria-hidden="true">
        <i class="fa" [ngClass]="headerIconClass"></i>
      </span>
      @if (titleKey) {
        <h3 class="report-card__title">{{ titleKey | translate: titleParams }}</h3>
      }
    </div>
    <button type="button" class="report-card__menu" [attr.aria-label]="'tr_menu' | translate">
      <i class="fa fa-ellipsis-h"></i>
    </button>
  </header>
  <div class="report-card__rule" role="presentation"></div>
  <div class="report-card__body">
    <p class="report-card__value">{{ value }}</p>
    @if (showFooter) {
      <div class="report-card__footer">
        @if (trendLabel) {
          <span
            class="report-card__pill"
            [class.report-card__pill--down]="trendPositive === false"
            >
            <i
              class="fa"
              [ngClass]="trendPositive === false ? 'fa-long-arrow-down' : 'fa-long-arrow-up'"
            ></i>
            {{ trendLabel }}
          </span>
        }
        @if (hintKey) {
          <span class="report-card__note">{{ hintKey | translate: hintParams }}</span>
        }
      </div>
    }
  </div>
</article>
