<div class="report-filters card">
  <div class="row">
    <div class="col-md-2">
      <label>{{ 'tr_from' | translate }}</label>
      <input class="s-control" type="date" [(ngModel)]="filters.from" />
    </div>
    <div class="col-md-2">
      <label>{{ 'tr_to' | translate }}</label>
      <input class="s-control" type="date" [(ngModel)]="filters.to" />
    </div>
    <div class="col-md-2">
      <label>{{ 'tr_report_filter_branch_id' | translate }}</label>
      <input
        class="s-control"
        type="text"
        [(ngModel)]="filters.branch_id"
        [placeholder]="'tr_report_placeholder_optional' | translate"
      />
    </div>
    <div class="col-md-2">
      <label>{{ 'tr_report_filter_product_id' | translate }}</label>
      <input
        class="s-control"
        type="text"
        [(ngModel)]="filters.product_id"
        [placeholder]="'tr_report_placeholder_optional' | translate"
      />
    </div>
    <div class="col-md-2">
      <label>{{ 'tr_report_filter_customer_id' | translate }}</label>
      <input
        class="s-control"
        type="text"
        [(ngModel)]="filters.customer_id"
        [placeholder]="'tr_report_placeholder_optional' | translate"
      />
    </div>
    <div class="col-md-2">
      <label>{{ 'tr_report_filter_group' | translate }}</label>
      <select class="s-control" [(ngModel)]="filters.groupBy">
        <option value="daily">{{ 'tr_report_group_daily' | translate }}</option>
        <option value="monthly">{{ 'tr_report_group_monthly' | translate }}</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="s-btn btn-primary" type="button" (click)="applyFilters()">{{ 'tr_apply' | translate }}</button>
    <button class="s-btn btn-secondary" type="button" (click)="reset()">{{ 'tr_reset' | translate }}</button>
  </div>
</div>
