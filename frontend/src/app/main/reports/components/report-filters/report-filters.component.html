<div class="report-filters card">
  <div class="report-filters__row report-filters__row--primary">
    <div class="report-filters__actions report-filters__actions--lead">
      <button class="s-btn btn-primary report-filters__apply" type="button" (click)="applyFilters()">
        {{ 'tr_apply' | translate }}
      </button>
    </div>

    <div class="report-filters__field">
      <label>{{ 'tr_from' | translate }}</label>
      <input class="s-control" type="date" [(ngModel)]="filters.from" name="reportFrom" />
    </div>
    <div class="report-filters__field">
      <label>{{ 'tr_to' | translate }}</label>
      <input class="s-control" type="date" [(ngModel)]="filters.to" name="reportTo" />
    </div>
    <div class="report-filters__field report-filters__field--branch" *ngIf="!branchFilterLocked">
      <label>{{ 'tr_branch' | translate }}</label>
      <ng-select
        class="s-control s-select report-filters__select"
        [placeholder]="'tr_report_all_branches' | translate"
        bindLabel="name"
        bindValue="_id"
        [items]="branches"
        [(ngModel)]="filters.branch_id"
        name="reportBranch"
        [clearable]="true"
        [searchable]="true"
        (change)="onBranchChange()"
      >
      </ng-select>
    </div>
    <div class="report-filters__field report-filters__field--branch" *ngIf="branchFilterLocked">
      <label>{{ 'tr_branch' | translate }}</label>
      <input class="s-control" type="text" [value]="lockedBranchLabel" disabled />
    </div>

    <div class="report-filters__field report-filters__field--sale-type" *ngIf="isProfitReport">
      <label>{{ 'tr_report_sale_type' | translate }}</label>
      <div class="report-filters__segment" role="group" [attr.aria-label]="'tr_report_sale_type' | translate">
        <button
          type="button"
          class="report-filters__segment-btn"
          [class.is-active]="profitSaleType === 'consolidated'"
          (click)="setProfitSaleType('consolidated')"
        >
          {{ 'tr_report_sale_type_all' | translate }}
        </button>
        <button
          type="button"
          class="report-filters__segment-btn"
          [class.is-active]="profitSaleType === 'cash'"
          (click)="setProfitSaleType('cash')"
        >
          {{ 'tr_report_profit_tab_cash' | translate }}
        </button>
        <button
          type="button"
          class="report-filters__segment-btn"
          [class.is-active]="profitSaleType === 'installment'"
          (click)="setProfitSaleType('installment')"
        >
          {{ 'tr_report_profit_tab_installment' | translate }}
        </button>
      </div>
    </div>

    <div class="report-filters__actions report-filters__actions--trail">
      <button
        class="s-btn btn-secondary report-filters__more-btn"
        type="button"
        *ngIf="hasAdditionalFilters"
        [class.is-open]="showAdditionalFilters"
        (click)="toggleAdditionalFilters()"
      >
        <i class="fa fa-filter" aria-hidden="true"></i>
        <span>{{ 'tr_report_additional_filters' | translate }}</span>
        <i
          class="fa"
          [ngClass]="showAdditionalFilters ? 'fa-angle-up' : 'fa-angle-down'"
          aria-hidden="true"
        ></i>
      </button>
      <button class="s-btn btn-secondary report-filters__reset-btn" type="button" (click)="reset()">
        {{ 'tr_reset' | translate }}
      </button>
      <ng-content></ng-content>
    </div>
  </div>

  <div
    class="report-filters__row report-filters__row--secondary report-filters__row--extra"
    *ngIf="hasAdditionalFilters && showAdditionalFilters"
  >
    <!-- Categories (sales / products / profit) -->
    <div
      class="report-filters__field report-filters__field--wide report-filters__field--categories"
      *ngIf="categoryFilterVisible"
    >
      <label>{{ 'tr_report_filter_category_id' | translate }}</label>
      <ng-select
        class="s-control s-select report-filters__select"
        [placeholder]="'tr_report_all_categories' | translate"
        bindLabel="name"
        bindValue="_id"
        [items]="categories"
        [(ngModel)]="filters.category_ids"
        name="reportCategory"
        [multiple]="true"
        [closeOnSelect]="false"
        [clearable]="true"
        [searchable]="true"
        (change)="onCategoryChange()"
      >
      </ng-select>
    </div>

    <!-- Supplier (products) -->
    <div class="report-filters__field report-filters__field--wide" *ngIf="reportType === 'products'">
      <label>{{ 'tr_search_supplier' | translate }}</label>
      <ng-select
        class="s-control s-select report-filters__select"
        [items]="vendorSearchItems"
        [typeahead]="vendorTypeahead$"
        [loading]="vendorsLoading"
        bindLabel="label"
        bindValue="_id"
        [(ngModel)]="selectedSupplierId"
        (ngModelChange)="onSupplierIdChange($event)"
        (open)="onVendorSelectOpen()"
        name="reportSupplier"
        [placeholder]="'tr_search_supplier_placeholder' | translate"
        [clearable]="true"
        [searchable]="true"
        notFoundText="{{ 'tr_no_items_found' | translate }}"
      >
        <ng-template ng-option-tmp let-item="item">
          <div class="weight-medium">{{ item.nameOfcompany }}</div>
          <div class="size-small text-muted">
            {{ item.name }}
            <span *ngIf="item.phone"> · {{ item.phone }}</span>
          </div>
        </ng-template>
        <ng-template ng-label-tmp let-item="item">
          {{ item.nameOfcompany }}
          <span *ngIf="item.name"> — {{ item.name }}</span>
        </ng-template>
      </ng-select>
    </div>

    <!-- Product -->
    <div class="report-filters__field report-filters__field--wide" *ngIf="productFilterVisible">
      <label>{{ 'tr_report_filter_product_id' | translate }}</label>
      <ng-select
        class="s-control s-select report-filters__select"
        [placeholder]="'tr_report_product_search_placeholder' | translate"
        [items]="products"
        [typeahead]="productTypeahead$"
        [loading]="productsLoading"
        bindLabel="label"
        bindValue="_id"
        [(ngModel)]="filters.product_id"
        (ngModelChange)="onProductIdChange($event)"
        (open)="onProductSelectOpen()"
        name="reportProduct"
        [clearable]="true"
        [searchable]="true"
        notFoundText="{{ 'tr_no_items_found' | translate }}"
      >
        <ng-template ng-option-tmp let-item="item">
          <div class="weight-medium">{{ item.name }}</div>
          <div class="size-small text-muted">
            <span *ngIf="item?.code">{{ item.code }}</span>
            <span *ngIf="item?.removedWhenOutOfStock || item?.stock === 0">
              · {{ 'tr_report_product_sold_out' | translate }}
            </span>
          </div>
        </ng-template>
        <ng-template ng-label-tmp let-item="item">
          {{ item.name }}
          <span *ngIf="item?.code"> ({{ item.code }})</span>
        </ng-template>
      </ng-select>
    </div>

    <!-- Customer phone -->
    <div class="report-filters__field" *ngIf="phoneFilterVisible">
      <label>{{ 'tr_report_filter_customer_phone' | translate }}</label>
      <input
        class="s-control"
        type="tel"
        [(ngModel)]="filters.customer_phone"
        [placeholder]="'tr_report_placeholder_customer_phone' | translate"
        autocomplete="tel"
        name="reportPhone"
      />
    </div>

    <!-- Seller (sales / profit) -->
    <div class="report-filters__field" *ngIf="sellerFilterVisible">
      <label>{{ 'tr_report_filter_seller' | translate }}</label>
      <ng-select
        class="s-control s-select report-filters__select"
        [placeholder]="'tr_report_all_sellers' | translate"
        [items]="salespeople"
        [(ngModel)]="filters.seller_name"
        name="reportSeller"
        [clearable]="true"
        [searchable]="true"
      >
      </ng-select>
    </div>

    <!-- Collector + installment status -->
    <div class="report-filters__field report-filters__field--wide" *ngIf="reportType === 'installments'">
      <label>{{ 'tr_collector' | translate }}</label>
      <ng-select
        class="s-control s-select report-filters__select"
        [placeholder]="'tr_all_collectors' | translate"
        bindLabel="name"
        bindValue="_id"
        [items]="collectors"
        [(ngModel)]="filters.collector_id"
        name="reportCollector"
        [clearable]="true"
        [searchable]="true"
      >
      </ng-select>
    </div>
    <div class="report-filters__field" *ngIf="reportType === 'installments'">
      <label>{{ 'tr_status' | translate }}</label>
      <select class="s-control" [(ngModel)]="filters.installment_status" name="installmentStatus">
        <option value="all">{{ 'tr_collections_all_statuses' | translate }}</option>
        <option value="paid">{{ 'tr_paid' | translate }}</option>
        <option value="unpaid">{{ 'tr_unpaid' | translate }}</option>
        <option value="overdue">{{ 'tr_collections_overdue' | translate }}</option>
        <option value="due_soon">{{ 'tr_collections_due_soon' | translate }}</option>
        <option value="promised">{{ 'tr_collections_promised' | translate }}</option>
        <option value="due">{{ 'tr_collections_due' | translate }}</option>
      </select>
    </div>

    <!-- Group by -->
    <div class="report-filters__field" *ngIf="groupByFilterVisible">
      <label>{{ 'tr_report_filter_group' | translate }}</label>
      <select class="s-control" [(ngModel)]="filters.groupBy" name="reportGroup">
        <option value="daily">{{ 'tr_report_group_daily' | translate }}</option>
        <option value="monthly">{{ 'tr_report_group_monthly' | translate }}</option>
      </select>
    </div>

    <!-- Bookings extras -->
    <ng-container *ngIf="reportType === 'bookings'">
      <div class="report-filters__field">
        <label>{{ 'tr_bookings_report_filter_status' | translate }}</label>
        <select class="s-control" [(ngModel)]="filters.booking_status" name="bookingStatus">
          <option value="all">{{ 'tr_bookings_report_status_all' | translate }}</option>
          <option value="active">{{ 'tr_bookings_report_status_active' | translate }}</option>
          <option value="cancelled">{{ 'tr_bookings_report_status_cancelled' | translate }}</option>
        </select>
      </div>
      <div class="report-filters__field">
        <label>{{ 'tr_bookings_report_filter_confirmed' | translate }}</label>
        <select class="s-control" [(ngModel)]="filters.booking_confirmed" name="bookingConfirmed">
          <option value="all">{{ 'tr_bookings_report_confirmed_all' | translate }}</option>
          <option value="true">{{ 'tr_bookings_report_confirmed_yes' | translate }}</option>
          <option value="false">{{ 'tr_bookings_report_confirmed_no' | translate }}</option>
        </select>
      </div>
      <div class="report-filters__field">
        <label class="report-filters__check">
          <input type="checkbox" [(ngModel)]="filters.warehouse_only" name="warehouseOnly" />
          {{ 'tr_bookings_report_warehouse_only' | translate }}
        </label>
      </div>
      <div class="report-filters__field report-filters__field--wide">
        <label>{{ 'tr_requested_by' | translate }}</label>
        <ng-select
          class="s-control s-select report-filters__select"
          [placeholder]="'tr_report_all_users' | translate"
          bindLabel="name"
          bindValue="_id"
          [items]="users"
          [(ngModel)]="filters.booking_created_by"
          name="bookingCreatedBy"
          [clearable]="true"
          [searchable]="true"
        >
        </ng-select>
      </div>
      <div class="report-filters__field report-filters__field--wide">
        <label>{{ 'tr_bookings_report_search' | translate }}</label>
        <input
          class="s-control"
          type="text"
          [(ngModel)]="filters.booking_search"
          name="bookingSearch"
          [placeholder]="'tr_bookings_report_search_ph' | translate"
        />
      </div>
    </ng-container>
  </div>
</div>
