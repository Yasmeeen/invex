<div class="report-filters card">
  <div class="row">
    <div class="col-md-2">
      <label>From</label>
      <input class="s-control" type="date" [(ngModel)]="filters.from" />
    </div>
    <div class="col-md-2">
      <label>To</label>
      <input class="s-control" type="date" [(ngModel)]="filters.to" />
    </div>
    <div class="col-md-2">
      <label>Branch ID</label>
      <input class="s-control" type="text" [(ngModel)]="filters.branch_id" placeholder="optional" />
    </div>
    <div class="col-md-2">
      <label>Product ID</label>
      <input class="s-control" type="text" [(ngModel)]="filters.product_id" placeholder="optional" />
    </div>
    <div class="col-md-2">
      <label>Customer ID</label>
      <input class="s-control" type="text" [(ngModel)]="filters.customer_id" placeholder="optional" />
    </div>
    <div class="col-md-2">
      <label>Group</label>
      <select class="s-control" [(ngModel)]="filters.groupBy">
        <option value="daily">Daily</option>
        <option value="monthly">Monthly</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="s-btn btn-primary" type="button" (click)="applyFilters()">Apply</button>
    <button class="s-btn btn-secondary" type="button" (click)="reset()">Reset</button>
  </div>
</div>
