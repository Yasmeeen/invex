<div class="table-container reports-table bg-white">
  <table class="s-table table border-table layout-fixed">
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ col.labelKey | translate }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td *ngFor="let col of columns">{{ row[col.key] }}</td>
      </tr>
      <tr *ngIf="!rows || rows.length === 0">
        <td [attr.colspan]="columns.length" class="text-center">{{ 'tr_report_no_data' | translate }}</td>
      </tr>
    </tbody>
  </table>
</div>
