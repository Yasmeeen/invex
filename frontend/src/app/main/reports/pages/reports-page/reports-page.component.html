<div class="reports-page">
  <div class="reports-page__head">
    <h2 class="reports-page__title">{{ reportTitleKey | translate }}</h2>
    <div class="reports-page__actions">
      <button class="s-btn btn-secondary" (click)="exportExcel()">{{ 'tr_report_export_excel' | translate }}</button>
      <button class="s-btn btn-secondary" (click)="exportPdf()">{{ 'tr_report_export_pdf' | translate }}</button>
      <button class="s-btn btn-primary" (click)="printReport()">{{ 'tr_report_print' | translate }}</button>
    </div>
  </div>

  <app-report-filters [reportType]="reportType" (apply)="onApplyFilters($event)"></app-report-filters>

  <div class="reports-page__cards">
    <app-report-card
      *ngFor="let card of cards; let i = index"
      [variantIndex]="i"
      [titleKey]="card.titleKey"
      [titleParams]="card.titleParams || {}"
      [value]="card.value"
      [hintKey]="card.hintKey || ''"
      [hintParams]="card.hintParams || {}"
      [trendLabel]="card.trendLabel || ''"
      [trendPositive]="card.trendPositive !== false"
    ></app-report-card>
  </div>

  <app-chart-wrapper
    *ngIf="chartOptions"
    [renderKey]="chartRedrawKey"
    [title]="(reportTitleKey | translate) + ' — ' + ('tr_report_chart_suffix' | translate)"
    [options]="chartOptions"
  ></app-chart-wrapper>

  <app-chart-wrapper
    *ngIf="secondaryChartOptions && reportType === 'bookings'"
    [renderKey]="chartBranchRedrawKey"
    [title]="('tr_bookings_chart_by_branch' | translate)"
    [options]="secondaryChartOptions"
  ></app-chart-wrapper>

  <app-chart-wrapper
    *ngIf="secondaryChartOptions && reportType === 'sales'"
    [renderKey]="chartBranchRedrawKey"
    [title]="('tr_report_chart_sales_by_payment' | translate)"
    [options]="secondaryChartOptions"
  ></app-chart-wrapper>

  <div class="mt-3" *ngIf="reportType === 'sales' && salesPaymentRows.length > 0">
    <h3 class="reports-page__subtitle">{{ 'tr_report_sales_by_payment' | translate }}</h3>
    <app-report-table [columns]="salesPaymentColumns" [rows]="salesPaymentRows"></app-report-table>
  </div>

  <div class="mt-3">
    <app-report-table [columns]="tableColumns" [rows]="tableRows" [roomy]="reportType === 'bookings'"></app-report-table>
  </div>

  <div
    class="reports-page__pagination mt-2"
    *ngIf="reportType === 'bookings' && bookingsMeta && bookingsMeta.totalCount > 0"
  >
    <button
      type="button"
      class="s-btn btn-secondary btn-sm"
      [disabled]="bookingsMeta.page <= 1"
      (click)="setBookingsPage(bookingsMeta.page - 1)"
    >
      {{ 'tr_bookings_report_prev' | translate }}
    </button>
    <span class="size-small text-muted">
      {{ 'tr_bookings_report_page' | translate : { page: bookingsMeta.page, total: bookingsTotalPages } }}
    </span>
    <button
      type="button"
      class="s-btn btn-secondary btn-sm"
      [disabled]="bookingsMeta.page >= bookingsTotalPages"
      (click)="setBookingsPage(bookingsMeta.page + 1)"
    >
      {{ 'tr_bookings_report_next' | translate }}
    </button>
  </div>

  <div class="mt-4" *ngIf="reportType === 'bookings' && topProductsRows.length > 0">
    <h3 class="reports-page__subtitle">{{ 'tr_bookings_top_products' | translate }}</h3>
    <app-report-table [columns]="topProductsColumns" [rows]="topProductsRows"></app-report-table>
  </div>

  <div class="mt-4" *ngIf="reportType === 'bookings' && upcomingRows.length > 0">
    <h3 class="reports-page__subtitle">{{ 'tr_bookings_upcoming' | translate }}</h3>
    <app-report-table [columns]="upcomingColumns" [rows]="upcomingRows"></app-report-table>
  </div>
</div>
