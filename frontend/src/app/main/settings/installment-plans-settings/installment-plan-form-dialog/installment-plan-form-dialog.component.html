<div class="ip-form">
  <h2 class="ip-form__title">{{ titleKey | translate }}</h2>

  <div class="ip-form__body">
    <label class="ip-form__field">
      <span>{{ 'tr_installment_plan_name' | translate }}</span>
      <input
        type="text"
        class="s-control"
        name="planName"
        [(ngModel)]="name"
        maxlength="120"
        autocomplete="off"
      />
    </label>

    <div class="ip-form__row">
      <label class="ip-form__field">
        <span>{{ 'tr_installment_plan_months' | translate }}</span>
        <input
          type="number"
          class="s-control"
          name="planMonths"
          [(ngModel)]="months"
          min="1"
          max="120"
        />
      </label>

      <label class="ip-form__field">
        <span>{{ 'tr_installment_plan_interest' | translate }}</span>
        <input
          type="number"
          class="s-control"
          name="planInterest"
          [(ngModel)]="interestPercent"
          min="0"
          max="500"
          step="0.01"
        />
      </label>
    </div>

    <label class="ip-form__field">
      <span>{{ 'tr_installment_plan_sort' | translate }}</span>
      <input type="number" class="s-control" name="planSort" [(ngModel)]="sortOrder" />
    </label>

    <div class="ip-form__field ip-form__field--toggle">
      <div class="ip-form__toggle-row">
        <div>
          <span class="ip-form__toggle-label">{{ 'tr_installment_plan_enabled' | translate }}</span>
          <small class="ip-form__hint">
            {{ (enabled ? 'tr_active' : 'tr_inactive') | translate }}
          </small>
        </div>
        <label class="ip-form__checkbox">
          <input type="checkbox" name="planEnabled" [(ngModel)]="enabled" />
          <span>{{ 'tr_active' | translate }}</span>
        </label>
      </div>
    </div>
  </div>

  <div class="ip-form__actions">
    <button type="button" class="s-btn btn-secondary" (click)="cancel()">
      {{ 'tr_action.cancel' | translate }}
    </button>
    <button type="button" class="s-btn btn-primary" (click)="submit()" [disabled]="cannotSave">
      {{ 'tr_action.save' | translate }}
    </button>
  </div>
</div>
