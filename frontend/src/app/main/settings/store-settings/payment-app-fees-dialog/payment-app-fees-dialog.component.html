<div class="payment-app-fees-dialog">
  <h2 mat-dialog-title class="payment-app-fees-dialog__title">
    {{ 'tr_payment_app_fees_dialog_title' | translate }}
  </h2>

  <div mat-dialog-content class="payment-app-fees-dialog__body">
    <p class="payment-app-fees-dialog__lead">{{ 'tr_payment_app_fees_dialog_lead' | translate }}</p>

    <div class="payment-app-fees-table">
      <div class="payment-app-fees-table__head">
        <span>{{ 'tr_payment_app_fees_col_method' | translate }}</span>
        <span>{{ 'tr_payment_app_fees_col_percent' | translate }}</span>
      </div>
      <div class="payment-app-fees-table__row" *ngFor="let row of rows">
        <span class="payment-app-fees-table__method">{{ row.labelKey | translate }}</span>
        <input
          type="number"
          class="s-control payment-app-fees-table__input"
          min="0"
          max="100"
          step="0.01"
          [(ngModel)]="percents[row.id]"
          [name]="'feePct_' + row.id"
        />
      </div>
    </div>
  </div>

  <div mat-dialog-actions align="end" class="payment-app-fees-dialog__actions">
    <button type="button" class="s-btn btn-secondary" (click)="cancel()" [disabled]="saving">
      {{ 'tr_cancel' | translate }}
    </button>
    <button type="button" class="s-btn btn-primary" (click)="save()" [disabled]="saving">
      {{ 'tr_save_settings' | translate }}
    </button>
  </div>
</div>
