<div class="dialog-pad">
  <h3 class="mb-3">{{ 'tr_treasury_set_opening' | translate }} — {{ data.label }}</h3>
  <div class="form-group">
    <label>{{ 'tr_treasury_opening' | translate }}</label>
    <input class="s-control width-100" type="number" step="0.01" [(ngModel)]="amount" />
  </div>
  <div class="form-group">
    <label>{{ 'tr_daily_expense_notes' | translate }}</label>
    <input class="s-control width-100" type="text" [(ngModel)]="note" maxlength="500" />
  </div>
  <div class="flex flex-end gap-sm mt-3">
    <button type="button" class="s-btn btn-secondary" (click)="cancel()" [disabled]="saving">
      {{ 'tr_cancel' | translate }}
    </button>
    <button type="button" class="s-btn btn-primary" (click)="submit()" [disabled]="saving">
      {{ 'tr_save' | translate }}
    </button>
  </div>
</div>
