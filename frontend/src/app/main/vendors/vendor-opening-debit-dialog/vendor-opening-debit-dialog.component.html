<div class="vendor-opening-debit-dialog bg-white plr-4 ptb-4">
  <div class="flex flex-space-between flex-middle mb-3">
    <h3 class="m-0">{{ titleKey() | translate }} — {{ vendor.name }}</h3>
    <button type="button" class="s-btn btn-secondary" (click)="cancel()">✖</button>
  </div>

  <p class="size-small text-muted mb-3" *ngIf="mode === 'set'">
    {{ 'tr_vendor_opening_debit_set_hint' | translate }}
  </p>
  <p class="size-small text-muted mb-3" *ngIf="mode === 'pay'">
    {{ 'tr_vendor_opening_debit_pay_hint' | translate }}
    <span *ngIf="maxPayAmount > 0">
      ({{ 'tr_remaining' | translate }}:
      {{ maxPayAmount | currency:'EGP':'symbol':'1.2-2':'en-EG' }})
    </span>
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>{{ 'tr_payment_amount' | translate }}</label>
      <input
        class="s-control width-100"
        type="number"
        min="0.01"
        step="0.01"
        formControlName="amount"
      />
    </div>

    <div class="form-group" *ngIf="mode === 'pay'">
      <label>{{ 'tr_payment_method' | translate }}</label>
      <select class="s-control width-100" formControlName="method">
        <option *ngFor="let m of paymentMethods" [value]="m.id">
          {{ m.labelKey | translate }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>{{ 'tr_payment_note' | translate }}</label>
      <textarea class="s-control width-100" rows="2" formControlName="note"></textarea>
    </div>

    <div class="flex flex-end gap-2">
      <button type="button" class="s-btn btn-secondary" (click)="cancel()" [disabled]="saving">
        {{ 'tr_cancel' | translate }}
      </button>
      <button type="submit" class="s-btn btn-primary" [disabled]="saving">
        {{ (mode === 'set' ? 'tr_save' : 'tr_add_payment') | translate }}
      </button>
    </div>
  </form>
</div>
