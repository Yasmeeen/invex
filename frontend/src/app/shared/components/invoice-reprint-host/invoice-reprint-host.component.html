<app-sale-receipt-print
  *ngIf="mode === 'sale' && data"
  [order]="data"
  [printDate]="printDate"
></app-sale-receipt-print>

<app-purchase-receipt-print
  *ngIf="mode === 'purchase' && data"
  [purchase]="data"
  [printDate]="printDate"
></app-purchase-receipt-print>

<app-payment-receipt-print
  *ngIf="mode === 'payment' && data"
  [receipt]="data"
  [printDate]="printDate"
></app-payment-receipt-print>

<app-drawer-close-receipt-print
  *ngIf="mode === 'drawerClose' && data"
  [receipt]="data"
  [printDate]="printDate"
></app-drawer-close-receipt-print>
