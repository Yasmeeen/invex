<app-sale-receipt-print
  *ngIf="mode === 'sale' && data"
  [order]="data"
  [printDate]="printDate"
></app-sale-receipt-print>

<app-purchase-receipt-print
  *ngIf="mode === 'purchase' && data"
  [purchase]="data"
  [printDate]="printDate"
></app-purchase-receipt-print>

<app-booking-receipt-print
  *ngIf="mode === 'booking' && data"
  [booking]="data"
  [printDate]="printDate"
></app-booking-receipt-print>
