<div class="vixa" [class.vixa--page]="mode === 'page'">
  <button
    *ngIf="mode === 'floating'"
    type="button"
    class="vixa__fab"
    (click)="toggle()"
    [attr.aria-label]="'tr_vixa' | translate"
    [attr.title]="'tr_vixa' | translate"
  >
    <span class="vixa__fab-avatar" aria-hidden="true">
      <img src="/assets/images/vixa.png" alt="" />
    </span>
    <span class="vixa__fab-label">
      <span class="vixa__fab-title">{{ 'tr_vixa' | translate }}</span>
      <span class="vixa__fab-sub">{{ 'tr_vixa_smart_assistant' | translate }}</span>
    </span>
  </button>

  <section
    class="vixa__panel"
    [class.vixa__panel--page]="mode === 'page'"
    *ngIf="open || mode === 'page'"
    role="dialog"
    aria-modal="false"
  >
    <header class="vixa__head">
      <div class="vixa__title">
        <span class="vixa__avatar" aria-hidden="true">
          <img src="/assets/images/vixa.png" alt="" />
        </span>
        <strong>{{ 'tr_vixa' | translate }}</strong>
        <span class="vixa__sub">{{ 'tr_vixa_subtitle' | translate }}</span>
      </div>
      <div class="vixa__actions">
        <button type="button" class="vixa__icon" (click)="clear()" [attr.title]="'tr_clear' | translate">
          <i class="fa fa-trash"></i>
        </button>
        <button
          *ngIf="mode === 'floating'"
          type="button"
          class="vixa__icon"
          (click)="close()"
          [attr.title]="'tr_close' | translate"
        >
          <i class="fa fa-times"></i>
        </button>
      </div>
    </header>

    <div class="vixa__body">
      <div class="vixa__msg" *ngFor="let m of messages" [class.vixa__msg--user]="m.role === 'user'">
        <div class="vixa__bubble">
          <div class="vixa__text">{{ m.text }}</div>
          <div class="vixa__sources" *ngIf="m.sources?.length">
            <div class="vixa__sources-title">{{ 'tr_vixa_disclaimer_sources' | translate }}</div>
            <a
              *ngFor="let s of m.sources"
              class="vixa__source"
              [href]="s.url"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{ s.title || s.url }}
            </a>
          </div>
        </div>
      </div>

      <div class="vixa__thinking" *ngIf="loading">{{ 'tr_vixa_thinking' | translate }}</div>
    </div>

    <footer class="vixa__foot">
      <input
        class="vixa__input"
        type="text"
        [(ngModel)]="input"
        [placeholder]="'tr_vixa_placeholder' | translate"
        (keyup.enter)="send()"
      />
      <button class="vixa__send" type="button" (click)="send()" [disabled]="loading">
        <i class="fa fa-paper-plane"></i>
      </button>
    </footer>
  </section>
</div>
